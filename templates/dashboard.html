<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FPGA 사진관</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #11131a;
            --card: #1d202a;
            --line: #303542;
            --text: #f5f7fb;
            --muted: #aeb6c7;
            --accent: #7c6cff;
            --good: #46d6a3;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Pretendard, "Malgun Gothic", sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .wrap { max-width: 1200px; margin: auto; padding: 28px; }
        header { display: flex; justify-content: space-between; gap: 20px; align-items: end; }
        h1 { margin: 0; font-size: 30px; }
        .sub { color: var(--muted); margin-top: 8px; }
        .grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 20px; margin-top: 24px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
        .card h2 { margin: 0 0 16px; font-size: 18px; }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; }
        select, button, a.button {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 11px 14px;
            color: var(--text);
            background: #272b37;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }
        button.primary, a.primary { background: var(--accent); border-color: var(--accent); }
        button:hover, a.button:hover { filter: brightness(1.1); }
        .state { display: inline-flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 800; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--good); box-shadow: 0 0 14px var(--good); }
        .message { color: var(--muted); margin-top: 10px; min-height: 24px; }
        progress { width: 100%; height: 14px; accent-color: var(--accent); margin-top: 14px; }
        .photo-box { min-height: 430px; display: grid; place-items: center; background: #0b0d12; border-radius: 14px; overflow: hidden; }
        .photo-box img { max-width: 100%; max-height: 620px; display: none; }
        .placeholder { color: #737c90; text-align: center; line-height: 1.7; }
        .photo-actions { display: none; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .qr { width: 220px; max-width: 100%; background: white; padding: 8px; border-radius: 12px; display: none; margin: auto; }
        .url { color: var(--muted); overflow-wrap: anywhere; text-align: center; margin-top: 12px; }
        .history { list-style: none; margin: 0; padding: 0; max-height: 270px; overflow: auto; }
        .history li { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
        .history span { color: var(--muted); }
        @media (max-width: 850px) {
            .grid { grid-template-columns: 1fr; }
            header { align-items: start; flex-direction: column; }
            .wrap { padding: 16px; }
        }
    </style>
</head>
<body>
<main class="wrap">
    <header>
        <div>
            <h1>FPGA 사진관</h1>
            <div class="sub">UART State 확인 · 완성 사진 · QR 다운로드</div>
        </div>
        <div id="connection">UART 연결 안 됨</div>
    </header>

    <section class="grid">
        <div>
            <article class="card">
                <h2>완성 사진</h2>
                <div class="photo-box">
                    <div id="photo-placeholder" class="placeholder">아직 받은 사진이 없습니다.<br>UART를 연결하고 EXPORT를 시작하세요.</div>
                    <img id="photo" alt="완성 사진">
                </div>
                <div id="photo-actions" class="photo-actions">
                    <a id="download" class="button primary">사진 다운로드</a>
                    <a id="mobile-page" class="button" target="_blank">휴대폰용 페이지 열기</a>
                </div>
            </article>
        </div>

        <div>
            <article class="card">
                <h2>UART 연결</h2>
                <div class="controls">
                    <select id="ports"></select>
                    <button class="primary" onclick="connectUART()">연결</button>
                    <button onclick="disconnectUART()">해제</button>
                    <button onclick="loadPorts()">새로고침</button>
                </div>
                <div class="sub">{{ baud_rate }} baud · 8N1</div>
            </article>

            <article class="card" style="margin-top:20px">
                <h2>현재 State</h2>
                <div class="state"><span class="dot"></span><span id="state-name">수신 전</span></div>
                <div id="status-hex" class="sub">Status: 0x00000000</div>
                <div id="message" class="message">UART 연결 대기</div>
                <progress id="progress" max="100" value="0"></progress>
            </article>

            <article class="card" style="margin-top:20px">
                <h2>휴대폰 QR</h2>
                <img id="qr" class="qr" alt="사진 페이지 QR">
                <div id="qr-placeholder" class="placeholder">사진을 받으면 QR이 표시됩니다.</div>
                <div id="page-url" class="url"></div>
            </article>

            <article class="card" style="margin-top:20px">
                <h2>State 수신 기록</h2>
                <ul id="history" class="history"></ul>
            </article>

            <article class="card" style="margin-top:20px">
                <h2>웹 화면 시험</h2>
                <button onclick="createTestPhoto()">sunset.mem으로 시험</button>
            </article>
        </div>
    </section>
</main>

<script>
let shownPhotoId = null;

async function requestJSON(url, options = {}) {
    const response = await fetch(url, options);
    const data = await response.json();
    if (!response.ok || data.ok === false) throw new Error(data.error || "요청 실패");
    return data;
}

async function loadPorts() {
    const data = await requestJSON("/api/ports");
    const select = document.getElementById("ports");
    select.innerHTML = "";
    if (data.ports.length === 0) {
        select.innerHTML = '<option value="">COM 포트 없음</option>';
        return;
    }
    data.ports.forEach(port => {
        const option = document.createElement("option");
        option.value = port.device;
        option.textContent = `${port.device} — ${port.description}`;
        select.appendChild(option);
    });
}

async function connectUART() {
    const port = document.getElementById("ports").value;
    try {
        await requestJSON("/api/connect", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({port})
        });
    } catch (error) { alert(error.message); }
}

async function disconnectUART() {
    await requestJSON("/api/disconnect", {method: "POST"});
}

async function createTestPhoto() {
    try {
        await requestJSON("/api/test-photo", {method: "POST"});
    } catch (error) { alert(error.message); }
}

function updatePhoto(photoId, pageUrl) {
    if (!photoId || photoId === shownPhotoId) return;
    shownPhotoId = photoId;
    const photo = document.getElementById("photo");
    photo.src = `/photos/${photoId}.png?t=${Date.now()}`;
    photo.style.display = "block";
    document.getElementById("photo-placeholder").style.display = "none";
    document.getElementById("photo-actions").style.display = "flex";
    document.getElementById("download").href = `/download/${photoId}`;
    document.getElementById("mobile-page").href = `/photo/${photoId}`;

    const qr = document.getElementById("qr");
    qr.src = `/qr/${photoId}.png?t=${Date.now()}`;
    qr.style.display = "block";
    document.getElementById("qr-placeholder").style.display = "none";
    document.getElementById("page-url").textContent = pageUrl || "";
}

function updateHistory(history) {
    const list = document.getElementById("history");
    list.innerHTML = "";
    history.forEach(item => {
        const li = document.createElement("li");
        li.innerHTML = `<span>${item.time}</span><strong>${item.state_name}</strong><span>${item.status_hex}</span>`;
        list.appendChild(li);
    });
}

async function pollStatus() {
    try {
        const data = await requestJSON("/api/status");
        document.getElementById("connection").textContent = data.connected
            ? `${data.port} 연결됨`
            : "UART 연결 안 됨";
        document.getElementById("state-name").textContent = data.state_name;
        document.getElementById("status-hex").textContent = `Status: ${data.status_hex}`;
        document.getElementById("message").textContent = data.message;
        document.getElementById("progress").value = data.receive_progress;
        updatePhoto(data.photo_id, data.photo_page_url);
        updateHistory(data.history);
    } catch (error) {
        document.getElementById("message").textContent = `웹 서버 통신 오류: ${error.message}`;
    }
}

loadPorts();
pollStatus();
setInterval(pollStatus, 300);
</script>
</body>
</html>
