<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FPGA PHOTO BOOTH</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d0f17;
            --card: rgba(29, 32, 44, 0.92);
            --line: #303647;
            --text: #f7f8fc;
            --muted: #a9b1c5;
            --accent: #7c6cff;
            --accent2: #ba70ff;
            --good: #45d6a2;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 0%, rgba(124,108,255,.20), transparent 34%),
                radial-gradient(circle at 100% 100%, rgba(186,112,255,.13), transparent 35%),
                var(--bg);
            font-family: Pretendard, "Malgun Gothic", sans-serif;
        }
        .wrap { width: min(1500px, 100%); margin: auto; padding: 30px; }
        header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 24px; }
        .brand { font-size: clamp(24px, 3vw, 42px); font-weight: 900; letter-spacing: .04em; }
        .brand span { color: #a99eff; }
        .status-pill { display: flex; align-items: center; gap: 10px; padding: 12px 17px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
        .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--good); box-shadow: 0 0 13px var(--good); }
        .layout { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(290px, .6fr); gap: 22px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.24); }
        .photo-card { padding: 14px; min-height: calc(100vh - 135px); display: grid; place-items: center; overflow: hidden; }
        .photo-card img {
            display: none;
            width: 100%;
            height: calc(100vh - 165px);
            object-fit: contain;
            border-radius: 16px;
        }
        .empty { text-align: center; color: var(--muted); line-height: 1.8; }
        .empty .icon { font-size: 64px; filter: grayscale(.2); margin-bottom: 12px; }
        .empty strong { display: block; color: var(--text); font-size: clamp(22px, 3vw, 36px); margin-bottom: 5px; }
        .side { display: flex; flex-direction: column; gap: 22px; }
        .state-card, .qr-card { padding: 25px; }
        .label { color: var(--muted); font-size: 15px; margin-bottom: 12px; }
        .state-name { font-size: clamp(36px, 5vw, 66px); font-weight: 950; line-height: 1; }
        .message { color: var(--muted); min-height: 26px; margin-top: 15px; line-height: 1.5; }
        progress { width: 100%; height: 16px; margin-top: 18px; accent-color: var(--accent); }
        .qr-card { flex: 1; text-align: center; display: grid; align-content: center; }
        .qr-card h2 { margin: 0 0 15px; font-size: 22px; }
        .qr { display: none; width: min(260px, 82%); margin: auto; background: white; padding: 10px; border-radius: 16px; }
        .qr-help { color: var(--muted); line-height: 1.6; }
        .open-photo { display: none; margin-top: 16px; padding: 13px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; text-decoration: none; font-weight: 800; }
        @media (max-width: 900px) {
            .wrap { padding: 16px; }
            .layout { grid-template-columns: 1fr; }
            .photo-card { min-height: 55vh; }
            .photo-card img { width: 100%; height: 65vh; }
            .side { display: grid; grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 600px) {
            header { align-items: flex-start; flex-direction: column; }
            .side { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<main class="wrap">
    <header>
        <div class="brand">FPGA <span>PHOTO BOOTH</span></div>
        <div class="status-pill"><span class="dot"></span><span id="ready-text">시스템 준비 중</span></div>
    </header>

    <section class="layout">
        <article class="card photo-card">
            <div id="photo-placeholder" class="empty">
                <div class="icon">📷</div>
                <strong>사진을 준비하고 있어요</strong>
                촬영과 편집이 끝나면 완성 사진이 여기에 표시됩니다.
            </div>
            <img id="photo" alt="완성 사진">
        </article>

        <aside class="side">
            <article class="card state-card">
                <div class="label">현재 진행 상태</div>
                <div id="state-name" class="state-name">IDLE</div>
                <div id="message" class="message">사진 촬영을 기다리고 있습니다.</div>
                <progress id="progress" max="100" value="0"></progress>
            </article>

            <article class="card qr-card">
                <h2>휴대폰으로 사진 받기</h2>
                <img id="qr" class="qr" alt="사진 다운로드 QR">
                <div id="qr-help" class="qr-help">완성 사진이 준비되면<br>다운로드 QR이 표시됩니다.</div>
                <a id="open-photo" class="open-photo" target="_blank">사진 페이지 열기</a>
            </article>
        </aside>
    </section>
</main>

<script>
let shownPhotoId = null;
let shownQrKey = null;

function clearExpiredPhoto() {
    shownPhotoId = null;
    shownQrKey = null;
    const photo = document.getElementById("photo");
    photo.removeAttribute("src");
    photo.style.display = "none";
    const placeholder = document.getElementById("photo-placeholder");
    placeholder.innerHTML = '<div class="icon">⌛</div><strong>사진 링크가 만료되었어요</strong>다음 완성 사진을 기다리고 있습니다.';
    placeholder.style.display = "block";
    const qr = document.getElementById("qr");
    qr.removeAttribute("src");
    qr.style.display = "none";
    document.getElementById("qr-help").innerHTML = "QR 링크가 만료되었습니다.<br>다음 사진을 기다려 주세요.";
    document.getElementById("open-photo").style.display = "none";
}

function updatePhoto(data) {
    if (!data.photo_id) {
        if (data.photo_expired) clearExpiredPhoto();
        return;
    }

    if (data.photo_id !== shownPhotoId) {
        shownPhotoId = data.photo_id;
        const photo = document.getElementById("photo");
        photo.src = `/photos/${data.photo_id}.png?t=${Date.now()}`;
        photo.style.display = "block";
        document.getElementById("photo-placeholder").style.display = "none";
    }

    if (data.photo_page_url) {
        const qrKey = `${data.photo_id}|${data.photo_page_url}`;
        const qr = document.getElementById("qr");
        if (qrKey !== shownQrKey) {
            shownQrKey = qrKey;
            qr.src = `/qr/${data.photo_id}.png?t=${Date.now()}`;
        }
        qr.style.display = "block";
        document.getElementById("qr-help").textContent = "QR을 촬영하면 사진 저장 페이지가 열립니다.";
        const openPhoto = document.getElementById("open-photo");
        openPhoto.href = data.photo_page_url;
        openPhoto.style.display = "block";
    }
}

async function pollStatus() {
    try {
        const response = await fetch("/api/status");
        const data = await response.json();
        document.getElementById("ready-text").textContent = data.connected ? "촬영 준비 완료" : "시스템 준비 중";
        document.getElementById("state-name").textContent = data.state_name;
        let friendlyMessage = "현재 단계를 진행하고 있습니다.";
        if (!data.connected) friendlyMessage = "시스템을 준비하고 있습니다.";
        else if (data.receiving_photo) friendlyMessage = "완성 사진을 전송하고 있습니다.";
        else if (data.state_name === "IDLE") friendlyMessage = "사진 촬영을 기다리고 있습니다.";
        else if (data.state_name === "EXPORT") friendlyMessage = "완성 사진을 준비하고 있습니다.";
        document.getElementById("message").textContent = friendlyMessage;
        document.getElementById("progress").value = data.receive_progress;
        updatePhoto(data);
    } catch (error) {
        document.getElementById("ready-text").textContent = "시스템 확인 중";
        document.getElementById("message").textContent = "잠시만 기다려 주세요.";
    }
}

pollStatus();
setInterval(pollStatus, 300);
</script>
</body>
</html>
